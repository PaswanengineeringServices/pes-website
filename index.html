<!DOCTYPE html>
<html>
<head>
<title>Paswan Engineering Services</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#f4f8fc;
color:#333;
}

/* ===== HEADER ===== */

header{
background:rgba(13,59,102,0.95);
backdrop-filter:blur(10px);
padding:15px 40px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 4px 20px rgba(0,0,0,0.2);
}

.logo-box img{
height:80px;
max-width:100%;
object-fit:contain;
transition:0.3s;
}

.logo-box img:hover{
transform:scale(1.05);
}

nav{
display:flex;
align-items:center;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-weight:bold;
position:relative;
}

nav a::after{
content:"";
position:absolute;
width:0%;
height:2px;
background:#25D366;
left:0;
bottom:-5px;
transition:0.3s;
}

nav a:hover::after{
width:100%;
}

nav a:hover{
color:#25D366;
}

/* MOBILE MENU */

.menu-toggle{
display:none;
font-size:28px;
color:white;
cursor:pointer;
}

@media(max-width:768px){

nav{
position:absolute;
top:70px;
right:0;
background:#0d3b66;
width:200px;
flex-direction:column;
display:none;
padding:20px;
}

nav a{
display:block;
margin:15px 0;
}

.menu-toggle{
display:block;
}

}

/* ===== SECTIONS ===== */

section{
padding:60px 20px;
text-align:center;
}

h2{
color:#0d3b66;
}

.btn{
padding:12px 25px;
background:#0d3b66;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:5px;
border:1px solid #ccc;
}

.owner-img{
width:200px;
height:200px;
border-radius:50%;
object-fit:cover;
border:5px solid #0d3b66;
}

.project-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.project-grid img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
}

.admin-panel{
background:#fff;
padding:20px;
border-radius:10px;
margin-top:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table th,table td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

footer{
background:#0d3b66;
color:white;
padding:20px;
text-align:center;
}

</style>
</head>

<body>

<header>

<div class="logo-box">
<img src="Pes%20feb.%20set.png" alt="PES Logo">
</div>

<nav id="navMenu">
<a href="#about">About</a>
<a href="#projects">Projects</a>
<a href="#register">Register</a>
<a href="#admin">Admin</a>
</nav>

<div class="menu-toggle" onclick="toggleMenu()">☰</div>

</header>

<section id="about">
<h2>Founder</h2>
<img src="Pes Owner.jpg" class="owner-img">
<h3>Atul Kumar Paswan</h3>
<p>Mechanical • Pipeline • Industrial Experts</p>
</section>

<section id="projects">
<h2>Our Projects</h2>
<div class="project-grid">
<img src="Pcs 1.jpg">
<img src="pcs2.jpg">
<img src="pcs3.jpg">
<img src="PCS 4.jpg">
</div>
</section>

<section id="register">
<h2>Worker Registration</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="mobile" placeholder="Mobile Number">
<input type="text" id="skill" placeholder="Skill">

<button class="btn" onclick="registerWorker()">Submit</button>
</section>

<section id="admin">
<h2>Admin Panel</h2>

<div class="admin-panel">
<button class="btn" onclick="loadWorkers()">Load Workers</button>

<table>
<thead>
<tr>
<th>Name</th>
<th>Mobile</th>
<th>Skill</th>
</tr>
</thead>
<tbody id="workerTable"></tbody>
</table>

</div>
</section>

<footer>
© 2026 Paswan Engineering Services | All Rights Reserved
</footer>

<script>

function toggleMenu(){
let nav=document.getElementById("navMenu");
if(nav.style.display==="flex"){
nav.style.display="none";
}else{
nav.style.display="flex";
nav.style.flexDirection="column";
}
}

function registerWorker(){

let name=document.getElementById("name").value;
let mobile=document.getElementById("mobile").value;
let skill=document.getElementById("skill").value;

if(name=="" || mobile=="" || skill==""){
alert("Please fill all fields");
return;
}

let workers=JSON.parse(localStorage.getItem("workers")) || [];

workers.push({name,mobile,skill});
localStorage.setItem("workers",JSON.stringify(workers));

alert("Worker Registered Successfully");

document.getElementById("name").value="";
document.getElementById("mobile").value="";
document.getElementById("skill").value="";
}

function loadWorkers(){

let workers=JSON.parse(localStorage.getItem("workers")) || [];

let table=document.getElementById("workerTable");
table.innerHTML="";

workers.forEach(w=>{
table.innerHTML+=`
<tr>
<td>${w.name}</td>
<td>${w.mobile}</td>
<td>${w.skill}</td>
</tr>
`;
});

}

</script>

</body>
</html>
